name: Build EXE

on:
  push:
    branches: [master]
    tags: ["v*"]          # Release-Version, z. B. v1.0.0 (eigenes Release mit der .exe)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Read version
        run: |
          $version = python -c "from lab_gui.version import __version__; print(__version__)"
          echo "EXE_NAME=LabControl_v$version" >> $env:GITHUB_ENV

      - name: Build EXE with PyInstaller
        run: pyinstaller LabControl.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}.exe

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LabControl (latest master build)"
          body: |
            Automatisch aus dem aktuellen `master` gebaut (Entwicklungsstand, nicht die Release-Version).
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: dist/${{ env.EXE_NAME }}.exe

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LabControl ${{ github.ref_name }}"
          body_path: release_notes.md
          prerelease: false
          make_latest: true
          files: dist/${{ env.EXE_NAME }}.exe
