name: Build EXE

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --name LaborSteuerung --paths . --add-data "lab_gui/icons;lab_gui/icons" --onefile --windowed lab_gui/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaborSteuerung-exe
          path: dist/LaborSteuerung.exe

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LaborSteuerung (latest master build)"
          body: |
            Automatisch aus dem aktuellen `master` gebaut.
            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: dist/LaborSteuerung.exe
