name: Linux checks

# Prueft die Mock-Pruefungen (tools/check_*.py) unter Linux, seit LabControl auch auf
# dem Raspberry Pi laufen soll (Phase 1 der Portierung, 10.11.2026). Hardware prueft das
# nicht. x86-Runner; fuer arm64 laesst sich ubuntu-24.04-arm ergaenzen, wenn verfuegbar.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run mock checks
        run: |
          failed=0
          for f in tools/check_*.py; do
            echo "::group::$f"
            if ! timeout 300 python "$f"; then
              echo "::error::$f fehlgeschlagen"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
